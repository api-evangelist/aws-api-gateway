specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: AWS API Gateway
providerId: aws-api-gateway
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - API Management
  - Serverless
  - AWS
description: 'FOCUS-aligned FinOps for AWS API Gateway: pay-as-you-go per-million-call pricing per
  API type, plus data transfer out, optional cache hours, optional portal subscription, and a
  12-month free tier. Cost is driven by call volume and the chosen API type (HTTP cheaper than REST).'
sources:
  - https://aws.amazon.com/api-gateway/pricing/
  - https://docs.aws.amazon.com/apigateway/latest/developerguide/limits.html
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Amazon Web Services, Inc.
serviceCategory: API Management / Serverless
billingModel:
  pricingCategory: Pay-As-You-Go
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
    - Refund
    - Credit
focusColumns:
  ServiceName: Amazon API Gateway
  ServiceCategory: API Management
  ProviderName: AWS
  PublisherName: Amazon Web Services, Inc.
  InvoiceIssuerName: Amazon Web Services, Inc.
  BillingCurrency: USD
  RegionId: varies
meters:
  - name: rest_api_calls
    unit: request
    aggregation: sum
    dimensions:
      - region
      - api_id
      - stage
  - name: http_api_calls
    unit: request
    aggregation: sum
    dimensions:
      - region
      - api_id
      - stage
  - name: websocket_messages
    unit: message
    aggregation: sum
    dimensions:
      - region
      - api_id
  - name: websocket_connection_minutes
    unit: minute
    aggregation: sum
    dimensions:
      - region
      - api_id
  - name: data_transfer_out
    unit: GB
    aggregation: sum
    dimensions:
      - region
  - name: cache_hours
    unit: hour
    aggregation: sum
    dimensions:
      - region
      - cache_size
  - name: portal_subscription
    unit: month
    aggregation: sum
    dimensions:
      - portal_id
  - name: portal_product_addon
    unit: product-month
    aggregation: sum
principles:
  - name: Visibility
    description: Use CloudWatch Metrics (Count, IntegrationLatency, 4XXError, 5XXError, CacheHitCount)
      per APIName + Stage; the Cost Explorer "Amazon API Gateway" service shows usage-type breakdown.
      Tag stages with cost allocation tags for FOCUS-aligned reporting.
  - name: Allocation
    description: Tag REST API stages and HTTP APIs with team / product / environment cost allocation
      tags; Cost & Usage Reports map UsageType (e.g. ApiGatewayRequest, ApiGatewayHttpApiRequest)
      to FOCUS ServiceSubcategory.
  - name: Optimization
    description: Migrate suitable workloads from REST API ($3.50/M) to HTTP API ($1.00/M) for ~70%
      savings; turn off caching where hit rate is low; right-size cache to the smallest tier that
      yields useful hit rate; avoid edge-optimized for in-region traffic.
  - name: Accountability
    description: Platform team typically owns API Gateway; product teams own per-API cost via tags and
      usage-plan-bound API keys for chargeback.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
