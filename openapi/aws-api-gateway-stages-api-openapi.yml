openapi: 3.2.0
info:
  title: Aws Api Gateway Stages API
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  termsOfService: https://aws.amazon.com/service-terms/
  version: '1.0'
  description: 'Operations tagged Stages across 2 of this provider''s published API definitions: aws-api-gateway-v1-openapi.yml, aws-api-gateway-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apigateway.{region}.amazonaws.com
  description: Amazon API Gateway regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
security:
- sigv4: []
tags:
- name: Stages
  description: Manage deployment stages
paths:
  /restapis/{restapi_id}/stages:
    parameters:
    - $ref: '#/components/parameters/RestApiId'
    get:
      operationId: getStages
      summary: Amazon API Gateway List Stages
      description: Lists deployment stages for a RestApi.
      tags:
      - Stages
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stages'
              examples:
                getStages200Example:
                  summary: Default getStages 200 response
                  x-microcks-default: true
                  value:
                    item:
                    - example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://apigateway.{region}.amazonaws.com
      description: Amazon API Gateway regional endpoint
      variables:
        region:
          default: us-east-1
          description: AWS region
  /v2/apis/{api_id}/stages:
    parameters:
    - $ref: '#/components/parameters/ApiId'
    get:
      operationId: getStages
      summary: Amazon API Gateway List Stages
      description: Gets a collection of stages for an API.
      tags:
      - Stages
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stages_2'
              examples:
                getStages200Example:
                  summary: Default getStages 200 response
                  x-microcks-default: true
                  value:
                    Items:
                    - example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createStage
      summary: Amazon API Gateway Create a Stage
      description: Creates a deployment stage for an API.
      tags:
      - Stages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageRequest'
            examples:
              createStageRequestExample:
                summary: Default createStage request
                x-microcks-default: true
                value:
                  StageName: my-resource
                  DeploymentId: abc123
                  AutoDeploy: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage_2'
              examples:
                createStage201Example:
                  summary: Default createStage 201 response
                  x-microcks-default: true
                  value:
                    StageName: my-resource
                    DeploymentId: abc123
                    Description: A description of this resource.
                    AutoDeploy: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://apigateway.{region}.amazonaws.com
      description: Amazon API Gateway regional endpoint
      variables:
        region:
          default: us-east-1
          description: AWS region
components:
  schemas:
    Stage:
      type: object
      properties:
        deploymentId:
          type: string
          description: Identifier of the deployment.
          example: abc123
        stageName:
          type: string
          description: Name of the stage.
          example: my-resource
        description:
          type: string
          description: Description of the stage.
          example: A description of this resource.
    Stages:
      type: object
      properties:
        item:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
          example:
          - example-value
    Stage_2:
      type: object
      properties:
        StageName:
          type: string
          description: Name of the stage.
          example: my-resource
        DeploymentId:
          type: string
          description: Deployment identifier.
          example: abc123
        Description:
          type: string
          description: Description of the stage.
          example: A description of this resource.
        AutoDeploy:
          type: boolean
          description: Whether updates auto-deploy to this stage.
          example: true
    Stages_2:
      type: object
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/Stage_2'
          example:
          - example-value
    CreateStageRequest:
      type: object
      required:
      - StageName
      properties:
        StageName:
          type: string
          description: Name of the stage.
          example: my-resource
        DeploymentId:
          type: string
          description: Deployment identifier.
          example: abc123
        AutoDeploy:
          type: boolean
          description: Whether to enable auto-deploy.
          example: true
  parameters:
    RestApiId:
      name: restapi_id
      in: path
      required: true
      description: Identifier of the RestApi resource.
      schema:
        type: string
    ApiId:
      name: api_id
      in: path
      required: true
      description: API identifier.
      schema:
        type: string
  securitySchemes:
    sigv4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 signed request.
