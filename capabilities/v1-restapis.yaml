naftiko: 1.0.0-alpha2
info:
  label: Amazon API Gateway V1 (REST) — RestApis
  description: 'Amazon API Gateway V1 (REST) — RestApis. 4 operations. Lead operation: Amazon API Gateway List REST APIs.
    Self-contained Naftiko capability covering one Aws Api Gateway business surface.'
  tags:
  - Aws Api Gateway
  - RestApis
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_API_GATEWAY_API_KEY: AWS_API_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: v1-restapis
    baseUri: https://apigateway.{region}.amazonaws.com
    description: Amazon API Gateway V1 (REST) — RestApis business capability. Self-contained, no shared references.
    resources:
    - name: restapis
      path: /restapis
      operations:
      - name: getrestapis
        method: GET
        description: Amazon API Gateway List REST APIs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createrestapi
        method: POST
        description: Amazon API Gateway Create a REST API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: restapis-restapi_id
      path: /restapis/{restapi_id}
      operations:
      - name: getrestapi
        method: GET
        description: Amazon API Gateway Get a REST API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleterestapi
        method: DELETE
        description: Amazon API Gateway Delete a REST API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_API_GATEWAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: v1-restapis-rest
    port: 8080
    description: REST adapter for Amazon API Gateway V1 (REST) — RestApis. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/restapis
      name: restapis
      description: REST surface for restapis.
      operations:
      - method: GET
        name: getrestapis
        description: Amazon API Gateway List REST APIs
        call: v1-restapis.getrestapis
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createrestapi
        description: Amazon API Gateway Create a REST API
        call: v1-restapis.createrestapi
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapis/{restapi-id}
      name: restapis-restapi-id
      description: REST surface for restapis-restapi_id.
      operations:
      - method: GET
        name: getrestapi
        description: Amazon API Gateway Get a REST API
        call: v1-restapis.getrestapi
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleterestapi
        description: Amazon API Gateway Delete a REST API
        call: v1-restapis.deleterestapi
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v1-restapis-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon API Gateway V1 (REST) — RestApis. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-api-gateway-list-rest
      description: Amazon API Gateway List REST APIs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v1-restapis.getrestapis
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-create-rest
      description: Amazon API Gateway Create a REST API
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: v1-restapis.createrestapi
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-get-rest
      description: Amazon API Gateway Get a REST API
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v1-restapis.getrestapi
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-delete-rest
      description: Amazon API Gateway Delete a REST API
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: v1-restapis.deleterestapi
      outputParameters:
      - type: object
        mapping: $.
