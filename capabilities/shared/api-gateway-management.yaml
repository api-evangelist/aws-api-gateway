naftiko: "1.0.0-alpha1"

info:
  label: "Amazon API Gateway Management API"
  description: "Runtime API for sending messages to connected WebSocket clients and managing connections in a deployed API Gateway WebSocket stage."
  tags:
    - Amazon API Gateway
    - AWS
    - WebSocket
    - Real-Time
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      API_GATEWAY_ENDPOINT: API_GATEWAY_ENDPOINT

capability:
  consumes:
    - type: http
      namespace: api-gateway-mgmt
      baseUri: https://{api-id}.execute-api.{region}.amazonaws.com/{stage}
      description: "Amazon API Gateway Management API for WebSocket connection management"
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_SIGV4_TOKEN}}"
        placement: header
      resources:
        - name: connections
          path: /@connections/{connectionId}
          description: "Manage WebSocket connections"
          operations:
            - name: get-connection
              method: GET
              description: "Get information about a connected WebSocket client"
              inputParameters:
                - name: connectionId
                  in: path
                  type: string
                  required: true
                  description: "The connection identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: post-to-connection
              method: POST
              description: "Send a message to a connected WebSocket client"
              inputParameters:
                - name: connectionId
                  in: path
                  type: string
                  required: true
                  description: "The connection identifier"
              body:
                type: json
                data:
                  message: "{{tools.message}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-connection
              method: DELETE
              description: "Disconnect a connected WebSocket client"
              inputParameters:
                - name: connectionId
                  in: path
                  type: string
                  required: true
                  description: "The connection identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: api-gateway-mgmt-rest
      resources:
        - path: /v1/connections/{connectionId}
          name: connections
          description: "WebSocket connection management"
          operations:
            - method: GET
              name: get-connection
              description: "Get a WebSocket connection"
              call: "api-gateway-mgmt.get-connection"
              with:
                connectionId: "rest.connectionId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: disconnect
              description: "Disconnect a WebSocket client"
              call: "api-gateway-mgmt.delete-connection"
              with:
                connectionId: "rest.connectionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: api-gateway-mgmt-mcp
      transport: http
      tools:
        - name: get-connection-info
          description: "Get information about a connected WebSocket client"
          hints:
            readOnly: true
          call: "api-gateway-mgmt.get-connection"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-message-to-connection
          description: "Send a message to a connected WebSocket client"
          hints:
            readOnly: false
            destructive: false
          call: "api-gateway-mgmt.post-to-connection"
          outputParameters:
            - type: object
              mapping: "$."
        - name: disconnect-client
          description: "Disconnect a WebSocket client from the API"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "api-gateway-mgmt.delete-connection"
          outputParameters:
            - type: object
              mapping: "$."
