naftiko: 1.0.0-alpha2
info:
  label: Amazon API Gateway V1 (REST) — ApiKeys
  description: 'Amazon API Gateway V1 (REST) — ApiKeys. 2 operations. Lead operation: Amazon API Gateway List API Keys. Self-contained
    Naftiko capability covering one Aws Api Gateway business surface.'
  tags:
  - Aws Api Gateway
  - ApiKeys
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_API_GATEWAY_API_KEY: AWS_API_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: v1-apikeys
    baseUri: https://apigateway.{region}.amazonaws.com
    description: Amazon API Gateway V1 (REST) — ApiKeys business capability. Self-contained, no shared references.
    resources:
    - name: apikeys
      path: /apikeys
      operations:
      - name: getapikeys
        method: GET
        description: Amazon API Gateway List API Keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapikey
        method: POST
        description: Amazon API Gateway Create an API Key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_API_GATEWAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: v1-apikeys-rest
    port: 8080
    description: REST adapter for Amazon API Gateway V1 (REST) — ApiKeys. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apikeys
      name: apikeys
      description: REST surface for apikeys.
      operations:
      - method: GET
        name: getapikeys
        description: Amazon API Gateway List API Keys
        call: v1-apikeys.getapikeys
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapikey
        description: Amazon API Gateway Create an API Key
        call: v1-apikeys.createapikey
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v1-apikeys-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon API Gateway V1 (REST) — ApiKeys. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-api-gateway-list-api
      description: Amazon API Gateway List API Keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v1-apikeys.getapikeys
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-create-api
      description: Amazon API Gateway Create an API Key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: v1-apikeys.createapikey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
