naftiko: 1.0.0-alpha2
info:
  label: Amazon API Gateway V2 (HTTP and WebSocket) — Stages
  description: 'Amazon API Gateway V2 (HTTP and WebSocket) — Stages. 2 operations. Lead operation: Amazon API Gateway List
    Stages. Self-contained Naftiko capability covering one Aws Api Gateway business surface.'
  tags:
  - Aws Api Gateway
  - Stages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_API_GATEWAY_API_KEY: AWS_API_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: v2-stages
    baseUri: https://apigateway.{region}.amazonaws.com
    description: Amazon API Gateway V2 (HTTP and WebSocket) — Stages business capability. Self-contained, no shared references.
    resources:
    - name: v2-apis-api_id-stages
      path: /v2/apis/{api_id}/stages
      operations:
      - name: getstages
        method: GET
        description: Amazon API Gateway List Stages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createstage
        method: POST
        description: Amazon API Gateway Create a Stage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_API_GATEWAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: v2-stages-rest
    port: 8080
    description: REST adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Stages. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2/apis/{api-id}/stages
      name: v2-apis-api-id-stages
      description: REST surface for v2-apis-api_id-stages.
      operations:
      - method: GET
        name: getstages
        description: Amazon API Gateway List Stages
        call: v2-stages.getstages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createstage
        description: Amazon API Gateway Create a Stage
        call: v2-stages.createstage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v2-stages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Stages. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: amazon-api-gateway-list-stages
      description: Amazon API Gateway List Stages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v2-stages.getstages
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-create-stage
      description: Amazon API Gateway Create a Stage
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: v2-stages.createstage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
