naftiko: 1.0.0-alpha2
info:
  label: Amazon API Gateway V2 (HTTP and WebSocket) — Authorizers
  description: 'Amazon API Gateway V2 (HTTP and WebSocket) — Authorizers. 2 operations. Lead operation: Amazon API Gateway
    List Authorizers. Self-contained Naftiko capability covering one Aws Api Gateway business surface.'
  tags:
  - Aws Api Gateway
  - Authorizers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_API_GATEWAY_API_KEY: AWS_API_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: v2-authorizers
    baseUri: https://apigateway.{region}.amazonaws.com
    description: Amazon API Gateway V2 (HTTP and WebSocket) — Authorizers business capability. Self-contained, no shared references.
    resources:
    - name: v2-apis-api_id-authorizers
      path: /v2/apis/{api_id}/authorizers
      operations:
      - name: getauthorizers
        method: GET
        description: Amazon API Gateway List Authorizers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createauthorizer
        method: POST
        description: Amazon API Gateway Create an Authorizer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_API_GATEWAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: v2-authorizers-rest
    port: 8080
    description: REST adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Authorizers. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2/apis/{api-id}/authorizers
      name: v2-apis-api-id-authorizers
      description: REST surface for v2-apis-api_id-authorizers.
      operations:
      - method: GET
        name: getauthorizers
        description: Amazon API Gateway List Authorizers
        call: v2-authorizers.getauthorizers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createauthorizer
        description: Amazon API Gateway Create an Authorizer
        call: v2-authorizers.createauthorizer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v2-authorizers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Authorizers. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: amazon-api-gateway-list-authorizers
      description: Amazon API Gateway List Authorizers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v2-authorizers.getauthorizers
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-create-authorizer
      description: Amazon API Gateway Create an Authorizer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: v2-authorizers.createauthorizer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
