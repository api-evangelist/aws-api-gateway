naftiko: 1.0.0-alpha2
info:
  label: Amazon API Gateway V2 (HTTP and WebSocket) — Routes
  description: 'Amazon API Gateway V2 (HTTP and WebSocket) — Routes. 2 operations. Lead operation: Amazon API Gateway List
    Routes. Self-contained Naftiko capability covering one Aws Api Gateway business surface.'
  tags:
  - Aws Api Gateway
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AWS_API_GATEWAY_API_KEY: AWS_API_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: v2-routes
    baseUri: https://apigateway.{region}.amazonaws.com
    description: Amazon API Gateway V2 (HTTP and WebSocket) — Routes business capability. Self-contained, no shared references.
    resources:
    - name: v2-apis-api_id-routes
      path: /v2/apis/{api_id}/routes
      operations:
      - name: getroutes
        method: GET
        description: Amazon API Gateway List Routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createroute
        method: POST
        description: Amazon API Gateway Create a Route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AWS_API_GATEWAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: v2-routes-rest
    port: 8080
    description: REST adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Routes. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v2/apis/{api-id}/routes
      name: v2-apis-api-id-routes
      description: REST surface for v2-apis-api_id-routes.
      operations:
      - method: GET
        name: getroutes
        description: Amazon API Gateway List Routes
        call: v2-routes.getroutes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createroute
        description: Amazon API Gateway Create a Route
        call: v2-routes.createroute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v2-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon API Gateway V2 (HTTP and WebSocket) — Routes. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: amazon-api-gateway-list-routes
      description: Amazon API Gateway List Routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v2-routes.getroutes
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-api-gateway-create-route
      description: Amazon API Gateway Create a Route
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: v2-routes.createroute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
