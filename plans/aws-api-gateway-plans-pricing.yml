specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: AWS API Gateway
providerId: aws-api-gateway
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - API Management
  - Serverless
  - REST API
  - HTTP API
  - WebSocket
  - AWS
description: AWS API Gateway is pay-as-you-go with no tiered subscription. You pay per million calls
  for REST / HTTP / WebSocket APIs, plus data transfer out and optional caching / portal charges.
  Pricing is regional and shown for US East (N. Virginia); other regions vary slightly. New customers
  receive a 12-month free tier of 1M calls/month per API type.
sources:
  - https://aws.amazon.com/api-gateway/pricing/
plans:
  - id: aws-api-gateway-rest-api
    name: REST API
    type: usage-based
    description: REST API endpoints with full feature set (request/response transforms, custom
      authorizers, usage plans, API keys, caching).
    entries:
      - label: REST API calls
        name: rest_api_calls
        type: tiered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1000000
        price: '$3.50 per million (first tier; volume discounts apply at 333M+ / 667M+ / 20B+)'
        userMultiplied: false
      - label: Data transfer out
        name: rest_data_transfer
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1
        price: '$0.09 per GB'
        userMultiplied: false
      - label: Cache (1.6 GB)
        name: rest_cache_1_6gb
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1
        price: '$0.038 per hour'
        userMultiplied: false
    elements:
      - name: API keys & usage plans
      - name: Request/response transforms
      - name: Custom authorizers
      - name: Caching (optional)
      - name: WAF integration
  - id: aws-api-gateway-http-api
    name: HTTP API
    type: usage-based
    description: Lower-cost API type optimized for HTTP backends (Lambda, ALB, EC2). Tiered pricing.
    entries:
      - label: HTTP API calls (first 300M/month)
        name: http_api_calls_tier1
        type: tiered
        metric: request
        limit: 300000000
        timeFrame: month
        geo: US-East-1
        unit: 1000000
        price: '$1.00 per million'
        userMultiplied: false
      - label: HTTP API calls (over 300M/month)
        name: http_api_calls_tier2
        type: tiered
        metric: request
        limit: -1
        timeFrame: month
        geo: US-East-1
        unit: 1000000
        price: '$0.90 per million'
        userMultiplied: false
      - label: Data transfer out
        name: http_data_transfer
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1
        price: '$0.09 per GB'
        userMultiplied: false
    elements:
      - name: JWT / OIDC authorizers
      - name: Lambda authorizers
      - name: VPC Link
      - name: Lower-cost Lambda backends
  - id: aws-api-gateway-websocket-api
    name: WebSocket API
    type: usage-based
    description: WebSocket API for real-time bidirectional connections. Charged per message and per
      connection minute.
    entries:
      - label: Messages
        name: websocket_messages
        type: metered
        metric: message
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1000000
        price: '$1.00 per million'
        userMultiplied: false
      - label: Connection minutes
        name: websocket_connection_minutes
        type: metered
        metric: minute
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1000000
        price: '$0.25 per million'
        userMultiplied: false
    elements:
      - name: Bidirectional messaging
      - name: Persistent connections
      - name: Route-based dispatch
  - id: aws-api-gateway-private-api
    name: Private REST API
    type: usage-based
    description: REST API exposed only inside a VPC via AWS PrivateLink. No data transfer charge but
      PrivateLink interface endpoint charges apply.
    entries:
      - label: Private REST API calls
        name: private_api_calls
        type: tiered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1000000
        price: '$3.50 per million (first tier)'
        userMultiplied: false
      - label: PrivateLink interface endpoint
        name: privatelink_endpoint
        type: metered
        metric: hour
        limit: -1
        timeFrame: usage
        geo: US-East-1
        unit: 1
        price: 'approximately $0.01 per hour per Availability Zone (PrivateLink rates)'
        userMultiplied: false
    elements:
      - name: VPC-only access
      - name: PrivateLink delivery
  - id: aws-api-gateway-portal
    name: API Gateway Portals (Developer Portal)
    type: subscription
    description: Hosted developer portal for documenting and exposing APIs. Flat monthly base plus
      per-product overage.
    entries:
      - label: Base portal
        name: portal_base
        type: subscription
        metric: portal
        limit: 1
        timeFrame: month
        geo: US-East-1
        unit: 1
        price: '$125.00 per portal per month (includes 10 PortalProducts)'
        userMultiplied: false
      - label: Additional PortalProduct
        name: portal_product_addon
        type: metered
        metric: product
        limit: -1
        timeFrame: month
        geo: US-East-1
        unit: 1
        price: '$12.50 per PortalProduct per month'
        userMultiplied: false
    elements:
      - name: Branded developer portal
      - name: API key self-service
      - name: Documentation hosting
  - id: aws-api-gateway-free-tier
    name: AWS Free Tier (12 months)
    type: freemium
    description: First-12-months free tier for new AWS customers. Covers REST, HTTP, and WebSocket
      APIs separately.
    entries:
      - label: REST API free tier
        name: free_rest_calls
        type: quota
        metric: request
        limit: 1000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: HTTP API free tier
        name: free_http_calls
        type: quota
        metric: request
        limit: 1000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: WebSocket free messages
        name: free_websocket_messages
        type: quota
        metric: message
        limit: 1000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: WebSocket free connection minutes
        name: free_websocket_connection_minutes
        type: quota
        metric: minute
        limit: 750000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 1M REST calls / month
      - name: 1M HTTP calls / month
      - name: 1M WebSocket messages + 750K connection minutes / month
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
